[package]
name = "chimera-plugin"
description = "CHIMERA as a CLAP, VST3 and AU instrument: MIDI notes sing, speak or beatbox, with a webview editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
chimera = { path = "../chimera" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false }
clap-wrapper = "=0.3.1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tiny_http = "0.12"

# the editor: a webview, on macOS and Windows
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "=0.57.1", features = ["devtools"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "objc2", "CFCGTypes"] }
