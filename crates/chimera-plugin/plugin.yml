# Copy of .github/workflows/plugin.yml: the agents' GitHub App can't write that folder, so changes
# are staged here for the owner to paste. Each job only calls scripts in crates/chimera-plugin, so
# it should rarely change.
name: plugin

on:
  push:
    branches: [main, "t3/**"]
    paths:
      - "crates/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/plugin.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown

      - uses: oven-sh/setup-bun@v2

      - uses: Swatinem/rust-cache@v2

      - name: Test the plugin and the engine's live path
        run: |
          cargo test -p chimera-plugin --release
          cargo test -p chimera --release --test singer_alloc

      - name: Build and install the bundles
        run: crates/chimera-plugin/macos/build.sh --install

      # before validating, so a strict validator can't keep a build from being tried in a real host
      - name: Package
        run: |
          mkdir -p out
          for b in clap vst3 component; do
            ditto -c -k --keepParent "target/bundled/CHIMERA.$b" "out/CHIMERA.$b.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: chimera-plugin-macos
          path: out/*.zip
          if-no-files-found: error

      - name: Validate
        run: crates/chimera-plugin/macos/validate.sh

      # what the host test rendered and saw, to listen to and look at
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chimera-host-test-macos
          path: |
            target/host-test/*.wav
            target/host-test/*.jpg
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: oven-sh/setup-bun@v2

      - uses: Swatinem/rust-cache@v2

      - name: Test, build, validate, and play it in REAPER
        run: crates/chimera-plugin/windows/ci.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chimera-plugin-windows
          path: out/CHIMERA-windows.zip
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chimera-host-test-windows
          path: |
            target/host-test/*.wav
            target/host-test/*.jpg
            target/host-test/*.log
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2

      - uses: Swatinem/rust-cache@v2

      - name: Test, build, validate, and play it in REAPER
        run: crates/chimera-plugin/linux/ci.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chimera-plugin-linux
          path: out/CHIMERA-linux.tar.gz
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chimera-host-test-linux
          path: |
            target/host-test/*.wav
            target/host-test/*.log
          if-no-files-found: ignore
